# Second jpackage launcher: the batch interface, as a CONSOLE program.
#
# The main RomRaider-TCU.exe is windowed, which is right for an editor but means
# Windows gives it no console - anything it prints is discarded, so driving it from
# a script or from CI silently produces nothing. This launcher is built from the
# same image and the same jar; the only differences are that it starts at the CLI
# entry point and that it keeps a console attached.
#
#   tcu-cli info     definitions\5eat_tcu_romraider_defs.xml roms\ACD1A06000.bin
#   tcu-cli selftest definitions\5eat_tcu_romraider_defs.xml roms\*.bin

main-class=com.romraider.cli.TcuCli
win-console=true
java-options=-Djava.awt.headless=true
java-options=-Xmx1024M
java-options=-Dlog4j.configuration=file:$APPDIR/log4j.properties
